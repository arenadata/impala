[pytest]
# A separate suite with its own virtualenv: an ini file here makes this directory the
# rootdir, so pytest does not load tests/conftest.py (Impala's test framework).
addopts = -ra --strict-markers
testpaths = .
filterwarnings =
    # ADBC DB-API: Flight SQL (and Impala) have no transactions to turn autocommit off
    ignore:Cannot disable autocommit:Warning
